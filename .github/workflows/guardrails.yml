name: Guardrails
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: runtimesecret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: plugin
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: croessner/nauthilus
          ref: 774ca996838aafd379b2557719914ff5d724a5aa
          path: core
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: core/go.sum
      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Validate exact-core plugin
        working-directory: plugin
        run: make guardrails CORE_REPO="$GITHUB_WORKSPACE/core"
